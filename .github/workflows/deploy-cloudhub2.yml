name: Deploy to CloudHub 2.0

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: 'dev'

env:
  MAVEN_OPTS: '-Xmx3072m'
  JAVA_VERSION: '17'
  MULE_VERSION: '4.10.1'

jobs:
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: 
      name: development
      url: https://server-info-dev.us-w2.cloudhub.io
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_DEV }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_DEV }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
              <server>
                <id>mulesoft-releases</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and Publish to Exchange
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_DEV }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_DEV }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
        run: |
          mvn clean deploy -DskipTests -DskipMuleDeploy -Danypoint.orgId=$ANYPOINT_ORG_ID

      - name: Deploy to CloudHub 2.0 DEV
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_DEV }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_DEV }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_ENV_ID: ${{ secrets.ANYPOINT_ENV_ID_DEV }}
          CH2_TARGET: ${{ secrets.CH2_TARGET }}
        run: |
          mvn deploy -DmuleDeploy \
            -Dmule.artifact=target/server-info-1.7.4-mule-application.jar \
            -DconnectedApp.clientId=$ANYPOINT_CLIENT_ID \
            -DconnectedApp.clientSecret=$ANYPOINT_CLIENT_SECRET \
            -Dcloudhub.environment=Sandbox \
            -Dcloudhub.applicationName=server-info-dev \
            -Dcloudhub.target="Cloudhub-US-West-1" \
            -Dcloudhub.replicas=1 \
            -Dcloudhub.vCores=0.1 \
            -Dcloudhub.businessGroup="Cloud01Group04\\Cloud04Group04" \
            -DskipTests
