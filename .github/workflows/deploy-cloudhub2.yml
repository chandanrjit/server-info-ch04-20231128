name: Deploy to CloudHub 2.0

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: 'dev'

env:
  MAVEN_OPTS: '-Xmx3072m'
  JAVA_VERSION: '17'
  MULE_VERSION: '4.10.1'

jobs:
  build:
    name: Build Mule Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-application
          path: target/*.jar
          retention-days: 7

  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/development' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: 
      name: development
      url: https://server-info-dev.us-w2.cloudhub.io
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mule-application
          path: target/

      - name: Configure Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_DEV }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_DEV }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
              <server>
                <id>mulesoft-releases</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish to Exchange
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_DEV }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_DEV }}
        run: |
          mvn install -DskipTests
          mvn deploy -DskipMuleDeploy

      - name: Deploy to CloudHub 2.0 DEV
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_DEV }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_DEV }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_ENV_ID: ${{ secrets.ANYPOINT_ENV_ID_DEV }}
          CH2_TARGET: ${{ secrets.CH2_TARGET }}
        run: |
          mvn deploy -DmuleDeploy \
            -Dmule.artifact=target/server-info-1.7.4-mule-application.jar \
            -DconnectedApp.clientId=$ANYPOINT_CLIENT_ID \
            -DconnectedApp.clientSecret=$ANYPOINT_CLIENT_SECRET \
            -Dcloudhub.environment=Sandbox \
            -Dcloudhub.applicationName=server-info-dev \
            -Dcloudhub.target="Cloudhub-US-West-1" \
            -Dcloudhub.replicas=1 \
            -Dcloudhub.vCores=0.1 \
            -Dcloudhub.businessGroup="Cloud01Group04\\Cloud04Group04" \
            -DskipTests

  deploy-test:
    name: Deploy to TEST
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'test')
    environment: 
      name: test
      url: https://server-info-test.us-w2.cloudhub.io
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mule-application
          path: target/

      - name: Configure Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_TEST }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_TEST }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
              <server>
                <id>mulesoft-releases</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish to Exchange
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_TEST }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_TEST }}
        run: |
          mvn install -DskipTests
          mvn deploy -DskipMuleDeploy

      - name: Deploy to CloudHub 2.0 TEST
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_TEST }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_TEST }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_ENV_ID: ${{ secrets.ANYPOINT_ENV_ID_TEST }}
          CH2_TARGET: ${{ secrets.CH2_TARGET }}
        run: |
          mvn deploy -DmuleDeploy \
            -Dmule.artifact=target/server-info-1.7.4-mule-application.jar \
            -DconnectedApp.clientId=$ANYPOINT_CLIENT_ID \
            -DconnectedApp.clientSecret=$ANYPOINT_CLIENT_SECRET \
            -Dcloudhub.environment=Sandbox \
            -Dcloudhub.applicationName=server-info-test \
            -Dcloudhub.target="Cloudhub-US-West-1" \
            -Dcloudhub.replicas=1 \
            -Dcloudhub.vCores=0.1 \
            -Dcloudhub.businessGroup="Cloud01Group04\\Cloud04Group04" \
            -DskipTests

  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: [build, deploy-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment: 
      name: production
      url: https://server-info-demo-2.us-w2.cloudhub.io
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mule-application
          path: target/

      - name: Configure Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_PROD }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_PROD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
              <server>
                <id>mulesoft-releases</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish to Exchange
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_PROD }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_PROD }}
        run: |
          mvn install -DskipTests
          mvn deploy -DskipMuleDeploy

      - name: Deploy to CloudHub 2.0 PROD
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_PROD }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_PROD }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_ENV_ID: ${{ secrets.ANYPOINT_ENV_ID_PROD }}
          CH2_TARGET: ${{ secrets.CH2_TARGET }}
        run: |
          mvn deploy -DmuleDeploy \
            -Dmule.artifact=target/server-info-1.7.4-mule-application.jar \
            -DconnectedApp.clientId=$ANYPOINT_CLIENT_ID \
            -DconnectedApp.clientSecret=$ANYPOINT_CLIENT_SECRET \
            -Dcloudhub.environment=Sandbox \
            -Dcloudhub.applicationName=server-info-demo-2 \
            -Dcloudhub.target="Cloudhub-US-West-1" \
            -Dcloudhub.replicas=1 \
            -Dcloudhub.vCores=0.1 \
            -Dcloudhub.businessGroup="Cloud01Group04\\Cloud04Group04" \
            -DskipTests

      - name: Notify deployment status
        if: always()
        run: |
          echo "Production deployment completed with status: ${{ job.status }}"
