name: Deploy to CloudHub 2.0

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: 'dev'

env:
  MAVEN_OPTS: '-Xmx3072m'
  JAVA_VERSION: '17'
  MULE_VERSION: '4.10.1'

jobs:
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: 
      name: development
      url: https://server-info-dev.us-w2.cloudhub.io
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-increment version
        id: version
        run: |
          # Get current version from pom.xml
          CURRENT_VERSION=$(grep -m 1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          
          # Extract major.minor from version (e.g., 1.7 from 1.7.5)
          BASE_VERSION=$(echo $CURRENT_VERSION | cut -d'.' -f1,2)
          
          # Get commit count since beginning
          COMMIT_COUNT=$(git rev-list --count HEAD)
          
          # Create new version: major.minor.commitCount
          NEW_VERSION="${BASE_VERSION}.${COMMIT_COUNT}"
          
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          
          # Update pom.xml
          sed -i.bak "s|<version>${CURRENT_VERSION}</version>|<version>${NEW_VERSION}</version>|" pom.xml
          rm pom.xml.bak

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_DEV }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_DEV }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
              <server>
                <id>mulesoft-releases</id>
                <username>~~~Client~~~</username>
                <password>$ANYPOINT_CLIENT_ID~?~$ANYPOINT_CLIENT_SECRET</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and Publish to Exchange
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_DEV }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_DEV }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
        run: |
          # Use business group org ID for Exchange publication
          mvn clean deploy -DskipTests -DskipMuleDeploy \
            -Danypoint.orgId=d29ffee3-8e4b-4f13-bb0c-ea5ca175c2a9

      - name: Deploy to CloudHub 2.0 DEV
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID_DEV }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET_DEV }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_ENV_ID: ${{ secrets.ANYPOINT_ENV_ID_DEV }}
          CH2_TARGET: ${{ secrets.CH2_TARGET }}
        run: |
          mvn deploy -DmuleDeploy \
            -Dmule.artifact=target/server-info-${{ steps.version.outputs.version }}-mule-application.jar \
            -DconnectedApp.clientId=$ANYPOINT_CLIENT_ID \
            -DconnectedApp.clientSecret=$ANYPOINT_CLIENT_SECRET \
            -Dcloudhub.environment=Sandbox \
            -Dcloudhub.applicationName=server-info-dev \
            -Dcloudhub.target="Cloudhub-US-West-1" \
            -Dcloudhub.replicas=1 \
            -Dcloudhub.vCores=0.1 \
            -Dcloudhub.businessGroup="Cloud01Group04\\Cloud04Group04" \
            -DskipTests
